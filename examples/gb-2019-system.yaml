# GB 2019 rebuilt from fuel, carbon and fleet data, with a 1 MW / 2 MWh battery
# valued on the modelled prices. Run: uv run openenergy system run examples/gb-2019-system.yaml
name: gb-2019-system
system:
  data: ../data/system
  prices: ../data/time_series/time_series_60min_singleindex_filtered.csv
  year: 2019
battery:
  power_mw: 1
  energy_mwh: 2
  eta_charge: 0.95
  eta_discharge: 0.95
