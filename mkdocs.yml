site_name: OpenEnergy
site_description: Backtest battery storage against real power-market prices.
site_url: https://koulakhilesh.github.io/OpenEnergy/
repo_url: https://github.com/koulakhilesh/OpenEnergy
repo_name: koulakhilesh/OpenEnergy
edit_uri: edit/master/docs/
copyright: >
  MIT licence. Data: Open Power System Data;
  carbon intensity from NESO's Carbon Intensity API (CC BY 4.0).

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Libre Franklin
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tooltips
  # Light paper first, like the website; the toggle remembers the reader's choice.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Guides:
      - Scenarios: guides/scenarios.md
      - Command line: guides/cli.md
      - Research with the Python API: guides/research.md
      - System analysis: guides/system.md
  - Data: data.md
  - API reference: api.md

# Design records stay in the repo for context but are not published.
exclude_docs: |
  design/

extra:
  generator: false
  social:
    - icon: fontawesome/solid/house
      link: https://koulakhilesh.github.io/
      name: Akhilesh Koul
    - icon: fontawesome/brands/github
      link: https://github.com/koulakhilesh/OpenEnergy
      name: OpenEnergy on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/akhilesh-koul
      name: LinkedIn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc: {permalink: true}
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
